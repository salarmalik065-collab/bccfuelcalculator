<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bcc Fuel Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #d9534f;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #c9302c;
        }
        .result {
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            border-left: 5px solid #d9534f;
        }
        .result h3 {
            margin-top: 0;
            color: #333;
        }
        .result p {
            margin: 8px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 Bcc Fuel Calculator</h2>
    
    <!-- Pakistan ke main shehron aur stops ki list -->
    <datalist id="pkCities">
        <option value="Karachi">
        <option value="Hyderabad">
        <option value="Moro Bypass">
        <option value="Sukkur">
        <option value="Rahim Yar Khan">
        <option value="Bahawalpur">
        <option value="Multan">
        <option value="Sahiwal">
        <option value="Depalpur">
        <option value="Faisalabad">
        <option value="Lahore">
        <option value="Gujranwala">
        <option value="Islamabad">
        <option value="Rawalpindi">
        <option value="Peshawar">
        <option value="Quetta">
    </datalist>

    <div class="form-group">
        <label for="fromCity">Kahan Se (Origin City / Stop):</label>
        <input type="text" id="fromCity" list="pkCities" placeholder="List se select karein ya naam likhein..." oninput="autoFillDistance()">
    </div>

    <div class="form-group">
        <label for="toCity">Kahan Tak (Destination City / Stop):</label>
        <input type="text" id="toCity" list="pkCities" placeholder="List se select karein ya naam likhein..." oninput="autoFillDistance()">
    </div>

    <div class="form-group">
        <label for="distanceKM">Kul Faasla (Distance in KM):</label>
        <input type="number" id="distanceKM" placeholder="Auto fill hoga ya khud KM likhein...">
        <div class="hint" id="distHint">Save routes ka faasla khud aa jayega, naye route ke liye khud KM likh dein.</div>
    </div>

    <div class="form-group">
        <label for="dieselRate">Current Diesel Rate (Per Litre - Rs):</label>
        <input type="number" id="dieselRate" value="360">
    </div>

    <div class="form-group">
        <label for="tareWeight">Khali Gari ka Vazan (Tare Weight in Tons):</label>
        <input type="number" id="tareWeight" value="12">
    </div>

    <div class="form-group">
        <label for="grossWeight">Kul Vazan sath Load (Gross Weight in Tons):</label>
        <input type="number" id="grossWeight" value="35">
    </div>

    <button onclick="calculateFuel()">Calculate Distance & Fuel</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>Nataij (Results):</h3>
        <p><strong>Route:</strong> <span id="resRouteName">-</span></p>
        <p><strong>Kul Faasla (Distance):</strong> <span id="resDist">0</span> KM</p>
        <p><strong>Net Cargo Load:</strong> <span id="resNetLoad">0</span> Tons</p>
        <p><strong>Andazan Average:</strong> <span id="resAvg">0</span> KM / Litre</p>
        <p><strong>Zarori Diesel:</strong> <span id="resFuel">0</span> Litres</p>
        <p><strong>Kul Kharcha (Total Cost):</strong> Rs. <span id="resCost">0</span></p>
    </div>
</div>

<script>
    // Yahan aap apne rozana ke routes aur unke KM add kar sakte hain
    // Format: "shehar1-shehar2": distance_in_km (dono taraf se khud kaam karega)
    const savedRoutes = {
        "karachi-hyderabad": 165,
        "karachi-moro bypass": 330,
        "karachi-sukkur": 475,
        "karachi-rahim yar khan": 665,
        "karachi-multan": 925,
        "karachi-depalpur": 1130,
        "karachi-faisalabad": 1190,
        "karachi-lahore": 1265,
        "karachi-islamabad": 1420,
        "karachi-rawalpindi": 1410,
        "karachi-peshawar": 1560,
        "karachi-quetta": 690,
        "sukkur-multan": 450,
        "sukkur-faisalabad": 715,
        "sukkur-lahore": 790,
        "sukkur-islamabad": 955,
        "multan-faisalabad": 250,
        "multan-lahore": 340,
        "multan-depalpur": 215,
        "faisalabad-lahore": 180,
        "faisalabad-islamabad": 325,
        "lahore-islamabad": 375
    };

    function autoFillDistance() {
        const from = document.getElementById('fromCity').value.trim().toLowerCase();
        const to = document.getElementById('toCity').value.trim().toLowerCase();
        const distInput = document.getElementById('distanceKM');
        const hint = document.getElementById('distHint');

        if (!from || !to) return;

        const key1 = from + "-" + to;
        const key2 = to + "-" + from;

        if (savedRoutes[key1]) {
            distInput.value = savedRoutes[key1];
            hint.innerText = "✅ Saved route mil gaya (" + savedRoutes[key1] + " KM). Zaroorat ho to tabdeel kar lein.";
            hint.style.color = "green";
        } else if (savedRoutes[key2]) {
            distInput.value = savedRoutes[key2];
            hint.innerText = "✅ Saved route mil gaya (" + savedRoutes[key2] + " KM). Zaroorat ho to tabdeel kar lein.";
            hint.style.color = "green";
        } else {
            hint.innerText = "ℹ️ Yeh route list mein save nahi hai — upar box mein khud KM likh dein.";
            hint.style.color = "#d9534f";
        }
    }

    function calculateFuel() {
        var origin = document.getElementById('fromCity').value.trim();
        var destination = document.getElementById('toCity').value.trim();
        var distanceKM = parseFloat(document.getElementById('distanceKM').value);
        var dieselRate = parseFloat(document.getElementById('dieselRate').value);
        var tareWeight = parseFloat(document.getElementById('tareWeight').value);
        var grossWeight = parseFloat(document.getElementById('grossWeight').value);

        if (!origin || !destination) {
            alert("Barah-e-karam shuruat aur manzil dono sheher/stops ke naam likhein!");
            return;
        }

        if (isNaN(distanceKM) || distanceKM <= 0) {
            alert("Barah-e-karam sahi Kul Faasla (KM) likhein!");
            return;
        }

        // Net cargo weight calculate karna
        var netLoad = grossWeight - tareWeight;
        if (netLoad < 0) netLoad = 0;

        // Aapka original average formula
        var baseAvg = 4.8;
        var adjustedAvg = baseAvg - (netLoad * 0.05);
        if (adjustedAvg < 1.8) {
            adjustedAvg = 1.8;
        }

        var totalFuel = distanceKM / adjustedAvg;
        var totalCost = totalFuel * dieselRate;

        // Results screen par show karna
        document.getElementById('resRouteName').innerText = origin + " se " + destination;
        document.getElementById('resDist').innerText = distanceKM.toFixed(1);
        document.getElementById('resNetLoad').innerText = netLoad;
        document.getElementById('resAvg').innerText = adjustedAvg.toFixed(2);
        document.getElementById('resFuel').innerText = totalFuel.toFixed(1);
        document.getElementById('resCost').innerText = totalCost.toLocaleString('en-PK', {maximumFractionDigits: 0});
        
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
