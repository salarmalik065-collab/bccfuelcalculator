<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #d9534f;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fff;
        }
        .custom-box {
            margin-top: 8px;
            border: 1px dashed #d9534f;
            background-color: #fff9f9;
        }
        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #c9302c;
        }
        .result {
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            border-left: 5px solid #d9534f;
        }
        .result h3 {
            margin-top: 0;
            color: #333;
        }
        .result p {
            margin: 8px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 Bcc Fuel Calculator</h2>

    <div class="form-group">
        <label for="fromSelect">Kahan Se (Origin City / Stop):</label>
        <select id="fromSelect" onchange="handleCityChange('from')">
            <option value="">-- Shehar Select Karein --</option>
            <option value="CUSTOM">✍️ Khud Naya Shehar / Stop Likhein...</option>
        </select>
        <input type="text" id="fromCustom" class="custom-box" style="display:none;" placeholder="Yahan naye stop ka naam likhein...">
    </div>

    <div class="form-group">
        <label for="toSelect">Kahan Tak (Destination City / Stop):</label>
        <select id="toSelect" onchange="handleCityChange('to')">
            <option value="">-- Shehar Select Karein --</option>
            <option value="CUSTOM">✍️ Khud Naya Shehar / Stop Likhein...</option>
        </select>
        <input type="text" id="toCustom" class="custom-box" style="display:none;" placeholder="Yahan naye stop ka naam likhein...">
    </div>

    <div class="form-group">
        <label for="distanceKM">Kul Faasla (Distance in KM):</label>
        <input type="number" id="distanceKM" placeholder="Shehar select karein, KM khud aa jayenge...">
        <div class="hint" id="distHint">List se dono shehar select karein, road distance khud aa jayega.</div>
    </div>

    <div class="form-group">
        <label for="dieselRate">Current Diesel Rate (Per Litre - Rs):</label>
        <input type="number" id="dieselRate" value="360">
    </div>

    <div class="form-group">
        <label for="tareWeight">Khali Gari ka Vazan (Tare Weight in Tons):</label>
        <input type="number" id="tareWeight" value="12">
    </div>

    <div class="form-group">
        <label for="grossWeight">Kul Vazan sath Load (Gross Weight in Tons):</label>
        <input type="number" id="grossWeight" value="35">
    </div>

    <button onclick="calculateFuel()">Calculate Distance & Fuel</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>Nataij (Results):</h3>
        <p><strong>Route:</strong> <span id="resRouteName">-</span></p>
        <p><strong>Kul Faasla (Distance):</strong> <span id="resDist">0</span> KM</p>
        <p><strong>Net Cargo Load:</strong> <span id="resNetLoad">0</span> Tons</p>
        <p><strong>Andazan Average:</strong> <span id="resAvg">0</span> KM / Litre</p>
        <p><strong>Zarori Diesel:</strong> <span id="resFuel">0</span> Litres</p>
        <p><strong>Kul Kharcha (Total Cost):</strong> Rs. <span id="resCost">0</span></p>
    </div>
</div>

    const exactOverrides = {
        "karachi-quetta": 690,
        "karachi-lahore": 1265,
        "karachi-islamabad": 1420,
        "karachi-faisalabad": 1190,
        "karachi-depalpur": 1130,
        "karachi-multan": 925,
        "karachi-sukkur": 475,
        "karachi-moro bypass": 330,
        "karachi-hyderabad": 165,
        "lahore-islamabad": 375,
        "multan-lahore": 340,
        "multan-faisalabad": 250
    };

    // Page load hote hi dono dropdown lists mein tamam shehar daalna
    window.onload = function() {
        const fromSelect = document.getElementById('fromSelect');
        const toSelect = document.getElementById('toSelect');
        const sortedCities = Object.keys(cityCoords).sort();

        sortedCities.forEach(city => {
            const opt1 = document.createElement('option');
            opt1.value = city;
            opt1.textContent = city;
            fromSelect.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = city;
            opt2.textContent = city;
            toSelect.appendChild(opt2);
        });
    };

    function handleCityChange(type) {
        const selectEl = document.getElementById(type + 'Select');
        const customEl = document.getElementById(type + 'Custom');

        if (selectEl.value === 'CUSTOM') {
            customEl.style.display = 'block';
            customEl.focus();
        } else {
            customEl.style.display = 'none';
            customEl.value = '';
        }
        autoCalculateDistance();
    }

    function autoCalculateDistance() {
        const fromSel = document.getElementById('fromSelect').value;
        const toSel = document.getElementById('toSelect').value;
        const distInput = document.getElementById('distanceKM');
        const hint = document.getElementById('distHint');

        if (!fromSel || !toSel) return;

        if (fromSel === 'CUSTOM' || toSel === 'CUSTOM') {
            distInput.value = '';
            hint.innerText = "✍️ Custom stop select kiya gaya hai — neeche Kul Faasla (KM) khud likhein.";
            hint.style.color = "#d9534f";
            return;
        }

        const key1 = fromSel.toLowerCase() + "-" + toSel.toLowerCase();
        const key2 = toSel.toLowerCase() + "-" + fromSel.toLowerCase();

        if (exactOverrides[key1] || exactOverrides[key2]) {
            const km = exactOverrides[key1] || exactOverrides[key2];
            distInput.value = km;
            hint.innerText = "✅ Exact Highway Distance: " + km + " KM";
            hint.style.color = "green";
            return;
        }

        if (fromSel === toSel) {
            distInput.value = 0;
            return;
        }

        const [lat1, lon1] = cityCoords[fromSel];
        const [lat2, lon2] = cityCoords[toSel];

        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        const roadKM = Math.round(R * c * 1.22);

        distInput.value = roadKM;
        hint.innerText = "✅ Estimated Road Distance: " + roadKM + " KM (Zaroorat ho to tabdeel kar lein)";
        hint.style.color = "green";
    }

    function calculateFuel() {
        const fromSel = document.getElementById('fromSelect').value;
        const toSel = document.getElementById('toSelect').value;
        const origin = (fromSel === 'CUSTOM') ? document.getElementById('fromCustom').value.trim() : fromSel;
        const destination = (toSel === 'CUSTOM') ? document.getElementById('toCustom').value.trim() : toSel;

        const distanceKM = parseFloat(document.getElementById('distanceKM').value);
        const dieselRate = parseFloat(document.getElementById('dieselRate').value);
        const tareWeight = parseFloat(document.getElementById('tareWeight').value);
        const grossWeight = parseFloat(document.getElementById('grossWeight').value);

        if (!origin || !destination) {
            alert("Barah-e-karam shuruat aur manzil dono sheher/stops select karein ya likhein!");
            return;
        }

        if (isNaN(distanceKM) || distanceKM <= 0) {
            alert("Barah-e-karam sahi Kul Faasla (KM) likhein!");
            return;
        }

        let netLoad = grossWeight - tareWeight;
        if (netLoad < 0) netLoad = 0;

        const baseAvg = 4.8;
        let adjustedAvg = baseAvg - (netLoad * 0.05);
        if (adjustedAvg < 1.8) {
            adjustedAvg = 1.8;
        }

        const totalFuel = distanceKM / adjustedAvg;
        const totalCost = totalFuel * dieselRate;

        document.getElementById('resRouteName').innerText = origin + " se " + destination;
        document.getElementById('resDist').innerText = distanceKM.toFixed(1);
        document.getElementById('resNetLoad').innerText = netLoad;
        document.getElementById('resAvg').innerText = adjustedAvg.toFixed(2);
        document.getElementById('resFuel').innerText = totalFuel.toFixed(1);
        document.getElementById('resCost').innerText = totalCost.toLocaleString('en-PK', {maximumFractionDigits: 0});
        
        document.getElementById('resultBox').style.display = 'block';
    }
