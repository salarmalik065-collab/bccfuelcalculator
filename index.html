<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bcc Fuel Calculator</title>
    <!-- Google Maps Places API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCINQeVHUWUQH6n_OrntjA4qk8ezLemnfo&libraries=places"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #d9534f;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c9302c;
        }
        .result {
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            border-left: 5px solid #d9534f;
        }
        .result p {
            margin: 8px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 Bcc Fuel Calculator (Live Maps)</h2>
    
    <div class="form-group">
        <label for="fromCity">Kahan Se (Origin City / Stop):</label>
        <input type="text" id="fromCity" placeholder="Maslan: Moro Bypass, Sukkur, Karachi...">
    </div>

    <div class="form-group">
        <label for="toCity">Kahan Tak (Destination City / Stop):</label>
        <input type="text" id="toCity" placeholder="Maslan: Faisalabad, Depalpur...">
    </div>

    <div class="form-group">
        <label for="dieselRate">Current Diesel Rate (Per Litre - Rs):</label>
        <input type="number" id="dieselRate" value="360">
    </div>

    <div class="form-group">
        <label for="tareWeight">Khali Gari ka Vazan (Tare Weight in Tons):</label>
        <input type="number" id="tareWeight" value="12">
    </div>

    <div class="form-group">
        <label for="grossWeight">Kul Vazan sath Load (Gross Weight in Tons):</label>
        <input type="number" id="grossWeight" value="35">
    </div>

    <button onclick="calculateLiveFuel()">Calculate Live Distance & Fuel</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>Nataij (Results):</h3>
        <p><strong>Route:</strong> <span id="resRouteName">-</span></p>
        <p><strong>Kul Faasla (Distance):</strong> <span id="resDist">0</span> KM</p>
        <p><strong>Net Cargo Load:</strong> <span id="resNetLoad">0</span> Tons</p>
        <p><strong>Andazan Average:</strong> <span id="resAvg">0</span> KM / Litre</p>
        <p><strong>Zarori Diesel:</strong> <span id="resFuel">0</span> Litres</p>
        <p><strong>Kul Kharcha (Total Cost):</strong> Rs. <span id="resCost">0</span></p>
    </div>
</div>

<script>
    // Google Maps Autocomplete Initialize
    let fromAutocomplete, toAutocomplete;

    function initAutocomplete() {
        const options = {
            componentRestrictions: { country: "pk" }, // Sirf Pakistan ke locations ke liye
            fields: ["formatted_address", "geometry", "name"],
            types: ["geocode", "establishment"]
        };

        fromAutocomplete = new google.maps.places.Autocomplete(document.getElementById('fromCity'), options);
        toAutocomplete = new google.maps.places.Autocomplete(document.getElementById('toCity'), options);
    }

    window.onload = initAutocomplete;

    function calculateLiveFuel() {
        var origin = document.getElementById('fromCity').value;
        var destination = document.getElementById('toCity').value;
        var dieselRate = parseFloat(document.getElementById('dieselRate').value);
        var tareWeight = parseFloat(document.getElementById('tareWeight').value);
        var grossWeight = parseFloat(document.getElementById('grossWeight').value);

        if (!origin || !destination) {
            alert("Barah-e-karam shuruat aur manzil dono sheher/stops ke naam likhein!");
            return;
        }

        var service = new google.maps.DistanceMatrixService();
        service.getDistanceMatrix({
            origins: [origin],
            destinations: [destination],
            travelMode: 'DRIVING',
            unitSystem: google.maps.UnitSystem.METRIC,
            avoidHighways: false,
            avoidTolls: false
        }, function(response, status) {
            if (status !== 'OK') {
                alert("Distance calculate karne mein masla hua: " + status);
                return;
            }

            var results = response.rows[0].elements[0];
            if (results.status === "ZERO_RESULTS") {
                alert("Is route ka rasta Google Maps par nahi mila.");
                return;
            }

            var distanceInMeters = results.distance.value;
            var distanceKM = distanceInMeters / 1000;

            // Net cargo weight calculate karna
            var netLoad = grossWeight - tareWeight;
            if (netLoad < 0) netLoad = 0;

            // Average formula
            var baseAvg = 4.8;
            var adjustedAvg = baseAvg - (netLoad * 0.05);
            if (adjustedAvg < 1.8) {
                adjustedAvg = 1.8;
            }

            var totalFuel = distanceKM / adjustedAvg;
            var totalCost = totalFuel * dieselRate;

            // Results screen par show karna
            document.getElementById('resRouteName').innerText = origin + " se " + destination;
            document.getElementById('resDist').innerText = distanceKM.toFixed(1);
            document.getElementById('resNetLoad').innerText = netLoad;
            document.getElementById('resAvg').innerText = adjustedAvg.toFixed(2);
            document.getElementById('resFuel').innerText = totalFuel.toFixed(1);
            document.getElementById('resCost').innerText = totalCost.toLocaleString('en-PK', {maximumFractionDigits: 0});
            
            document.getElementById('resultBox').style.display = 'block';
        });
    }
</script>

</body>
</html>
